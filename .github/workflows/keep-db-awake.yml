# Supabase 무료 프로젝트가 1주일 동안 요청이 적어 일시정지되지 않도록
# 매일 한 번 DB에 질의를 보냄(외부 예약 서비스: GitHub Actions 예약 실행).
# 저장소 Settings > Secrets and variables > Actions 에 DATABASE_URL 을 넣어야 함.
name: keep-db-awake

on:
  schedule:
    - cron: "17 0 * * *"   # 매일 00:17 UTC = 한국 09:17
  workflow_dispatch: {}      # Actions 화면에서 직접 실행해 볼 수 있음

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query Supabase
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then echo "DATABASE_URL 시크릿: 없음"; exit 1; fi
          echo "DATABASE_URL 시크릿: 있음"
          psql "$DATABASE_URL" -tAc "select 'tf_students=' || count(*) from tf_students; select now();"
